name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'aesthetic-badshah-masala.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q aesthetic-badshah-masala.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTHETIC-BADSHAH-MASALA
          path: project/app/build/outputs/apk/debug/*.apk
