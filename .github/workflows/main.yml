name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Repository download
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 9.3.1
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Extract Android project
      - name: Extract Android Project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o "aesthetic-badshah-masala-fixed.zip" -d android-project

          echo "===== Extracted files ====="
          find android-project -maxdepth 4 -type f | sort

      # 5. Find Android project automatically
      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            echo "The ZIP does not contain a valid Android Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Create debug keystore
      - name: Create Debug Keystore
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            echo "Creating debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          echo "Keystore:"
          ls -lh debug.keystore

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building APK..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      # 8. Find APK
      - name: Find APK
        shell: bash
        run: |
          echo "================================"
          echo "APK files:"
          echo "================================"

          find android-project \
            -type f \
            -name "*.apk" \
            -print

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
